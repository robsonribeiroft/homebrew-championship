<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Fifinha Championship — campeonato caseiro de FIFA">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F4F4F0" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- fundo -->
  <rect width="1280" height="360" fill="#0B0B0C"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1277" height="357" fill="none" stroke="#F4F4F0" stroke-width="3"/>

  <!-- selo FIFA -->
  <rect x="64" y="64" width="112" height="48" fill="#C6FF00" stroke="#F4F4F0" stroke-width="3"/>
  <text x="120" y="97" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="24" fill="#0B0B0C">FIFA</text>
  <text x="196" y="96" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="15" letter-spacing="2" fill="#8D8D88">// HOME CUP</text>

  <!-- título -->
  <text x="60" y="206" font-family="'Space Grotesk', 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="-2" fill="#F4F4F0">FIFINHA</text>
  <text x="60" y="280" font-family="'Space Grotesk', 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="-2" fill="#C6FF00">CHAMPIONSHIP</text>
  <text x="64" y="324" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="15" letter-spacing="1.5" fill="#8D8D88">GRUPOS · MATA-MATA · CAMPEÃO — 100% OFFLINE</text>

  <!-- mini placar com sombra dura -->
  <rect x="862" y="80" width="360" height="224" fill="#C6FF00"/>
  <rect x="852" y="70" width="360" height="224" fill="#141416" stroke="#F4F4F0" stroke-width="3"/>
  <rect x="853.5" y="71.5" width="357" height="44" fill="#1D1D20"/>
  <line x1="852" y1="116" x2="1212" y2="116" stroke="#F4F4F0" stroke-width="3"/>
  <rect x="868" y="82" width="132" height="24" fill="#C6FF00"/>
  <text x="934" y="99" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="12" letter-spacing="1" fill="#0B0B0C">PRÓXIMO JOGO</text>
  <text x="1196" y="99" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="12" fill="#8D8D88">SEMIFINAL</text>

  <!-- setas ▲ -->
  <rect x="924" y="132" width="48" height="26" fill="#1D1D20" stroke="#F4F4F0" stroke-width="2.5"/>
  <path d="M940 150l8-8 8 8" fill="none" stroke="#F4F4F0" stroke-width="3"/>
  <rect x="1092" y="132" width="48" height="26" fill="#1D1D20" stroke="#F4F4F0" stroke-width="2.5"/>
  <path d="M1108 150l8-8 8 8" fill="none" stroke="#F4F4F0" stroke-width="3"/>

  <!-- placar -->
  <text x="948" y="236" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="80" fill="#F4F4F0">2</text>
  <text x="1032" y="222" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="34" fill="#8D8D88">×</text>
  <text x="1116" y="236" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="80" fill="#F4F4F0">1</text>

  <!-- botão -->
  <rect x="936" y="258" width="200" height="24" fill="#C6FF00" stroke="#F4F4F0" stroke-width="2"/>
  <text x="1036" y="275" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="700" font-size="12" letter-spacing="1.5" fill="#0B0B0C">FINALIZAR PARTIDA</text>
</svg>
